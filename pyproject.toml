[project]
name = "helmet-voice-assistant"
version = "0.1.0"
description = "Starter LiveKit + Sarvam voice assistant for smart helmet workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[sarvam,silero]~=1.4",
    "livekit-plugins-noise-cancellation~=0.2",
    "python-dotenv>=1.0.1,<2.0.0",
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11.0,<0.12.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[project]
name = "helmet-phone-first"
version = "0.1.0"
description = "Phone-first backend and assistant service for the smart helmet assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4.0",
    "livekit-agents[sarvam,silero]~=1.4",
    "livekit-plugins-noise-cancellation~=0.2",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11.0,<0.12.0",
]

[project.scripts]
phone-first-backend = "backend.server:main"
phone-first-assistant = "assistant_service.main:main"
phone-first-assistant-stable = "assistant_service.stable:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "assistant_service*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
